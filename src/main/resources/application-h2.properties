# Perfil h2: roda sem Docker e sem instalar banco. Ativado por: .\gradlew.bat bootRun -Ph2
# O H2 é um banco embutido (só uma dependência do Gradle) que roda em memória:
# as tabelas são criadas a cada subida e os dados somem ao parar a aplicação.
spring.docker.compose.enabled=false
spring.flyway.enabled=false

spring.datasource.url=jdbc:h2:mem:watchjobs;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# O Flyway (V1/V2) usa SQL do PostgreSQL; aqui as tabelas vêm do db/h2/schema.sql.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2/schema.sql
spring.sql.init.encoding=UTF-8
