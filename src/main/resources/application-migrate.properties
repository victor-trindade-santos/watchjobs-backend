# Perfil migrate: aplica as migrations do Flyway pela conexão direct, com o usuário dono, e termina.
# Uso: java -jar app.jar --spring.profiles.active=prod,migrate
spring.main.web-application-type=none
spring.main.banner-mode=off
# Com a inicialização preguiçosa (do prod), só o Flyway e o MigrateRunner sobem.

spring.datasource.url=${DB_URL_DIRECT}
spring.datasource.username=${DB_OWNER_USERNAME}
spring.datasource.password=${DB_OWNER_PASSWORD}
spring.datasource.hikari.initialization-fail-timeout=1
spring.flyway.enabled=true
