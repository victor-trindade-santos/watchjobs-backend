spring.application.name=watchjobs-backend

# Segredos locais (ex.: ADZUNA_APP_KEY) ficam no .env da raiz do projeto, fora do Git.
spring.config.import=optional:file:.env[.properties]

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/watchjobs}
spring.datasource.username=${DB_USERNAME:watchjobs}
spring.datasource.password=${DB_PASSWORD:watchjobs}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.default_schema=core
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.open-in-view=false

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:Hs7cUjRKXTmq11RM2eysTZhbAmvAM6Dp/um6vf2Mn98=}
jwt.expiration-minutes=15
jwt.refresh-expiration-days=30

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${MAIL_FROM:WatchJobs <nao-responda@watchjobs.local>}
app.mail.mode=${MAIL_MODE:smtp}

app.corpus.retention-days=${CORPUS_RETENTION_DAYS:30}
app.ingestion.time-budget-minutes=${INGEST_TIME_BUDGET_MIN:8}
app.ingestion.http-timeout-seconds=5
app.ingestion.user-agent=${INGEST_USER_AGENT:WatchJobsBot/1.0 (+https://github.com/victor-trindade-santos/watchjobs-backend)}

# Motor (F07): circuit breaker por fonte (o config da fonte pode sobrescrever) e fila com lease, backoff e DLQ
app.ingestion.circuit.failure-threshold=${INGEST_CIRCUIT_FAILURES:5}
app.ingestion.circuit.recovery-minutes=${INGEST_CIRCUIT_RECOVERY_MIN:60}
app.queue.lease-minutes=${QUEUE_LEASE_MIN:15}
app.queue.backoff-base-seconds=${QUEUE_BACKOFF_BASE_SEC:60}
app.queue.backoff-max-minutes=${QUEUE_BACKOFF_MAX_MIN:360}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Importação do LinkedIn (F3): ZIP de até 10 MB, lido em memória
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Busca sob demanda (F5): limites por usuário, tempo limite do agregador e cache por consulta
app.ondemand.per-hour=${ONDEMAND_PER_HOUR:5}
app.ondemand.per-day=${ONDEMAND_PER_DAY:20}
app.ondemand.timeout-seconds=${ONDEMAND_TIMEOUT_SEC:8}
app.ondemand.cache-hours=${ONDEMAND_CACHE_HOURS:6}

# Disparo do motor pelo GitHub (workflow_dispatch). Sem token, o disparo não faz nada (local).
app.motor.github-token=${GITHUB_DISPATCH_TOKEN:}
app.motor.github-repo=${GITHUB_REPO:}
app.motor.workflow=${GITHUB_WORKFLOW:ingestion.yml}
app.motor.ref=${GITHUB_REF_NAME:main}

# Avisos (F5): resumo diário às 8 h de Brasília; link de descadastro aponta para a API
app.notify.digest-hour=${NOTIFY_DIGEST_HOUR:8}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8081}

# Lembretes (F04): entrevista nas próximas N horas, candidatura parada há N dias, vaga salva saindo do ar em N dias
app.notify.interview-hours=${NOTIFY_INTERVIEW_HOURS:24}
app.notify.stale-days=${NOTIFY_STALE_DAYS:14}
app.notify.saved-expiring-days=${NOTIFY_SAVED_EXPIRING_DAYS:3}

# Push no Android (F04): sem as duas variáveis, o envio fica desligado
app.push.fcm.project-id=${FCM_PROJECT_ID:}
app.push.fcm.credentials=${FCM_CREDENTIALS_JSON:}

# Assistente de perfil (F05): bloqueia as rotas fora do perfil até a conclusão. Ligado no perfil prod.
app.profile-setup.enforce=${PROFILE_SETUP_ENFORCE:false}

# Currículo adaptado e cover letter (F10): sem OPENAI_API_KEY a geração fica desligada (503)
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:60}
app.documents.daily-limit=${DOCUMENTS_DAILY_LIMIT:20}



