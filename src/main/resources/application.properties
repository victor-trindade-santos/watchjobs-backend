spring.application.name=watchjobs-backend

# Segredos locais (ex.: ADZUNA_APP_KEY) ficam no .env da raiz do projeto, fora do Git.
spring.config.import=optional:file:.env[.properties]

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/watchjobs}
spring.datasource.username=${DB_USERNAME:watchjobs}
spring.datasource.password=${DB_PASSWORD:watchjobs}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.default_schema=core

spring.jpa.open-in-view=false

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:Hs7cUjRKXTmq11RM2eysTZhbAmvAM6Dp/um6vf2Mn98=}
jwt.expiration-minutes=15
jwt.refresh-expiration-days=30

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${MAIL_FROM:WatchJobs <nao-responda@watchjobs.local>}
app.mail.mode=${MAIL_MODE:smtp}

app.corpus.retention-days=${CORPUS_RETENTION_DAYS:30}
app.ingestion.time-budget-minutes=${INGEST_TIME_BUDGET_MIN:8}
app.ingestion.http-timeout-seconds=5
app.ingestion.user-agent=${INGEST_USER_AGENT:WatchJobsBot/1.0 (+https://github.com/victor-trindade-santos/watchjobs-backend)}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Importação do LinkedIn (F3): ZIP de até 10 MB, lido em memória
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Busca sob demanda (F5): limites por usuário, tempo limite do agregador e cache por consulta
app.ondemand.per-hour=${ONDEMAND_PER_HOUR:5}
app.ondemand.per-day=${ONDEMAND_PER_DAY:20}
app.ondemand.timeout-seconds=${ONDEMAND_TIMEOUT_SEC:8}
app.ondemand.cache-hours=${ONDEMAND_CACHE_HOURS:6}

# Disparo do motor pelo GitHub (workflow_dispatch). Sem token, o disparo não faz nada (local).
app.motor.github-token=${GITHUB_DISPATCH_TOKEN:}
app.motor.github-repo=${GITHUB_REPO:}
app.motor.workflow=${GITHUB_WORKFLOW:ingestion.yml}
app.motor.ref=${GITHUB_REF_NAME:main}

# Avisos (F5): resumo diário às 8 h de Brasília; link de descadastro aponta para a API
app.notify.digest-hour=${NOTIFY_DIGEST_HOUR:8}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8081}



