spring.application.name=watchjobs-backend

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/watchjobs}
spring.datasource.username=${DB_USERNAME:watchjobs}
spring.datasource.password=${DB_PASSWORD:watchjobs}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.default_schema=core

spring.jpa.open-in-view=false

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:Hs7cUjRKXTmq11RM2eysTZhbAmvAM6Dp/um6vf2Mn98=}
jwt.expiration-minutes=15
jwt.refresh-expiration-days=30

app.cors.allowed-origins=http://localhost:8080

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${MAIL_FROM:WatchJobs <nao-responda@watchjobs.local>}
app.mail.mode=${MAIL_MODE:smtp}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs



