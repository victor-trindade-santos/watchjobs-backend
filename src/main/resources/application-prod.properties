# Perfil prod: segredos e conexões só por variável de ambiente, sem valor padrão.
# Sem JWT_SECRET (ou sem DB_URL), a aplicação não sobe: "Could not resolve placeholder 'JWT_SECRET'".
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
# O Neon dorme: a API precisa subir mesmo com o banco ainda acordando.
spring.datasource.hikari.initialization-fail-timeout=-1

# A API usa o watchjobs_app (sem DDL): as migrations rodam só no perfil migrate, no pipeline de deploy.
spring.flyway.enabled=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.main.lazy-initialization=true
spring.docker.compose.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_ACCESS_MINUTES:15}
jwt.refresh-expiration-days=${JWT_REFRESH_DAYS:30}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.mail.from=${MAIL_FROM}

app.public-base-url=${PUBLIC_BASE_URL}

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
