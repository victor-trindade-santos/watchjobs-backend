name: Deploy

# A cada push na main: testa, recria o branch de restauração do Neon, migra, publica a imagem no GHCR,
# atualiza o Azure Container Apps e confere /health.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  RESOURCE_GROUP: watchjobs-rg
  CONTAINER_APP: watchjobs-api
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: watchjobs
          POSTGRES_USER: watchjobs
          POSTGRES_PASSWORD: watchjobs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U watchjobs"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e jar
        run: ./gradlew build --no-daemon

      # Um branch só (pre-deploy), recriado a cada deploy: o plano gratuito do Neon limita o número de branches.
      - name: Apagar o branch de restauração anterior
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: pre-deploy
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Branch do Neon antes da migration
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: pre-deploy
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Migrations (conexão direct, usuário dono)
        env:
          DB_URL_DIRECT: ${{ secrets.DB_URL_DIRECT }}
          DB_OWNER_USERNAME: ${{ secrets.DB_OWNER_USERNAME }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_URL: ${{ secrets.DB_URL_DIRECT }}
          DB_USERNAME: ${{ secrets.DB_OWNER_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_CORS_ALLOWED_ORIGINS: ${{ vars.APP_CORS_ALLOWED_ORIGINS }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: java -jar build/libs/app.jar --spring.profiles.active=prod,migrate

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagem
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # OIDC com identidade gerenciada: nenhuma senha do Azure guardada no GitHub.
      - name: Login no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Os valores dos segredos ficam no próprio Container App (az containerapp secret set, uma vez só).
      - name: Publicar no Azure Container Apps
        env:
          CORS_ORIGINS: ${{ vars.APP_CORS_ALLOWED_ORIGINS }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --cpu 0.5 --memory 1.0Gi --min-replicas 1 --max-replicas 2 \
            --set-env-vars \
              "SPRING_PROFILES_ACTIVE=prod" \
              "APP_CORS_ALLOWED_ORIGINS=$CORS_ORIGINS" \
              "PUBLIC_BASE_URL=$PUBLIC_BASE_URL" \
              "GITHUB_REPO=$GITHUB_REPO" \
              "MAIL_HOST=$MAIL_HOST" \
              "MAIL_PORT=$MAIL_PORT" \
              "MAIL_FROM=$MAIL_FROM" \
              "DB_URL=secretref:db-url" \
              "DB_USERNAME=secretref:db-username" \
              "DB_PASSWORD=secretref:db-password" \
              "JWT_SECRET=secretref:jwt-secret" \
              "MAIL_USERNAME=secretref:mail-username" \
              "MAIL_PASSWORD=secretref:mail-password" \
              "ADZUNA_APP_ID=secretref:adzuna-app-id" \
              "ADZUNA_APP_KEY=secretref:adzuna-app-key" \
              "GITHUB_DISPATCH_TOKEN=secretref:github-dispatch-token" \
            --output none
          # O app nasce com a imagem de exemplo na porta 80; a API escuta na 8080.
          PORT_NOW=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.targetPort -o tsv)
          if [ "$PORT_NOW" != "8080" ]; then
            az containerapp ingress update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --target-port 8080 --output none
          fi

      - name: Teste em /health
        run: |
          FQDN=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 18); do
            if curl -fsS "https://$FQDN/health"; then exit 0; fi
            sleep 10
          done
          exit 1
