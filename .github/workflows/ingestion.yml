name: Motor de ingestão

# Rodada agendada de 6 em 6 horas e rodada pedida pela API (busca sob demanda, workflow_dispatch).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Pedidos seguidos entram em fila: nunca cancela uma rodada em andamento.
concurrency:
  group: ingestion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache do jar
        id: jar
        uses: actions/cache@v4
        with:
          path: build/libs/app.jar
          key: motor-jar-${{ hashFiles('src/main/**', 'build.gradle.kts', 'settings.gradle.kts') }}

      - uses: gradle/actions/setup-gradle@v4
        if: steps.jar.outputs.cache-hit != 'true'
      - name: Compilar
        if: steps.jar.outputs.cache-hit != 'true'
        run: ./gradlew bootJar --no-daemon

      # Código de saída 1 só quando todas as fontes falharam (o GitHub avisa por e-mail).
      - name: Rodada
        env:
          DB_URL: ${{ secrets.DB_URL_DIRECT }}
          DB_USERNAME: ${{ secrets.DB_OWNER_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          APP_CORS_ALLOWED_ORIGINS: ${{ vars.APP_CORS_ALLOWED_ORIGINS }}
          INGEST_TIME_BUDGET_MIN: "8"
        run: java -jar build/libs/app.jar --spring.profiles.active=prod,ingestion
